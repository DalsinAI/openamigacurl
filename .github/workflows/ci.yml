name: openamigacurl CI

on:
  push:
  pull_request:

jobs:
  host:
    # curl with patches/ and OpenTLS's host build, against a local HTTPS
    # server (tests/host/host-test.sh). The Amiga build is build.sh's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/openamigatls
          ref: e7c0e2d546f33c655c1e4512b4669428daf8a56f
          path: openamigatls
      - name: Fetch curl (SOURCES)
        run: |
          mkdir -p tarballs
          curl -fsSL -o tarballs/curl-8.22.0.tar.xz https://curl.se/download/curl-8.22.0.tar.xz
      - name: Host test
        run: OPENTLS_SRC=openamigatls JOBS=4 tests/host/host-test.sh
      - name: Host test with AddressSanitizer and UBSan
        run: OPENTLS_SRC=openamigatls JOBS=4 SANITIZE=1 tests/host/host-test.sh

  amiga:
    # libcurl and curltest for the 68040 with the OpenAmigaGCC release and
    # OpenNDK's network headers (tests/amiga/ci-build.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/openamigatls
          ref: e7c0e2d546f33c655c1e4512b4669428daf8a56f
          path: openamigatls
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/openamigasdk
          ref: 5bfeaea0d004e86afb990fddb591bf0039f09233
          path: openamigasdk
      - name: Fetch the toolchain, curl and zlib (SOURCES)
        run: |
          mkdir -p tarballs tc
          U=https://github.com/DalsinAI/openamigagcc/releases/download/v16.2.0-open3
          curl -fsSL -o tc/tc.tar.xz $U/openamigagcc-16.2.0-open3-x86_64-linux.tar.xz
          echo "9fcc136ab59e3bb5b91d2764d0bf290b709d72d7380be4ce0cdf005edf8eff21  tc/tc.tar.xz" | sha256sum -c -
          tar xf tc/tc.tar.xz -C tc
          curl -fsSL -o tarballs/curl-8.22.0.tar.xz https://curl.se/download/curl-8.22.0.tar.xz
          curl -fsSL -o tarballs/zlib-1.3.1.tar.xz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
      - name: 68040 build
        run: TOOLCHAIN_DIR=tc/openamigagcc-16.2.0-open3-x86_64-linux OPENNDK=openamigasdk/OpenNDK OPENTLS_SRC=openamigatls tests/amiga/ci-build.sh
